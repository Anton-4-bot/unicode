name: bisect roc windows
on:
  push:
    branches: [repro-windows-quote-literal]
    paths: [.github/workflows/bisect.yaml]
permissions:
  contents: read
jobs:
  build:
    name: build ${{ matrix.commit }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { commit: f8e33abf9160663cf83480f21feebe77b722c05d, zig: 0.17.0 }
          - { commit: 7266bc9e51ac36d22b5a6ff9af6b8e5b9226f04f, zig: 0.17.0 }
          - { commit: 30d8cdb66b5e567a47169940025a885c2dc51a7a, zig: 0.17.0 }
          - { commit: b650f9fbe48202968a4986eadc69d8eb561b0e64, zig: 0.17.0 }
          - { commit: 5a8edf4827b3e41121e367ae50f0274ed1a17e3a, zig: 0.17.0 }
          - { commit: 0e3d210181939631c1e640a3b8aabfc1357a9d41, zig: 0.17.0 }
          - { commit: a6e6f422800cb20b867586aab8af5804b718c89e, zig: 0.17.1 }
          - { commit: b7e4e9adbaeb314028697d115ace4fdb47587853, zig: 0.17.1 }
    steps:
      - uses: actions/checkout@v7
        with:
          repository: roc-lang/roc
          ref: ${{ matrix.commit }}
          path: roc-src
          fetch-depth: 1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: ${{ matrix.zig }}
          use-cache: false
      - name: Cross-compile roc.exe
        run: |
          cd roc-src
          for i in 1 2 3; do
            zig build build-release -Dtarget=x86_64-windows-gnu -Dcompiler-version=bisect-${{ matrix.commit }} && break
            [ $i -lt 3 ] || exit 1
          done
          ls -la zig-out/bin
      - uses: actions/upload-artifact@v4
        with:
          name: roc-${{ matrix.commit }}
          path: roc-src/zig-out/bin/roc.exe
          retention-days: 3
  test:
    name: test ${{ matrix.commit }}
    needs: build
    if: always()
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        commit:
          - f8e33abf9160663cf83480f21feebe77b722c05d
          - 7266bc9e51ac36d22b5a6ff9af6b8e5b9226f04f
          - 30d8cdb66b5e567a47169940025a885c2dc51a7a
          - b650f9fbe48202968a4986eadc69d8eb561b0e64
          - 5a8edf4827b3e41121e367ae50f0274ed1a17e3a
          - 0e3d210181939631c1e640a3b8aabfc1357a9d41
          - a6e6f422800cb20b867586aab8af5804b718c89e
          - b7e4e9adbaeb314028697d115ace4fdb47587853
    defaults:
      run:
        shell: bash {0}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: roc-${{ matrix.commit }}
          path: rocbin
      - name: Run variants
        run: |
          ROC="$PWD/rocbin/roc.exe"
          "$ROC" version
          status=0
          for cmd in "check variants/only_Path/Locale.roc --no-cache" "check platform/Locale.roc --no-cache" "check hello.roc --no-cache"; do
            echo "::group::roc $cmd"
            "$ROC" $cmd > out.txt 2>&1; code=$?
            cat out.txt
            echo "::endgroup::"
            echo "RESULT roc $cmd -> exit $code | $(grep -m1 -E 'crash happened|No errors|error|panic' out.txt)"
            [ $code -eq 0 ] || status=1
          done
          exit $status

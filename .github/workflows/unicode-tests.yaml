name: unicode tests with fixed roc
on:
  push:
    branches: [repro-windows-quote-literal]
    paths: [.github/workflows/unicode-tests.yaml]
permissions:
  contents: read
  actions: read
jobs:
  test:
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          repository: Anton-4-bot/unicode
          ref: fix-static-pie-platforms
          path: unicode
      - uses: actions/download-artifact@v4
        with:
          name: roc-fix
          path: rocpath
          run-id: 43320735323
          github-token: ${{ github.token }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0
          use-cache: false
      - name: roc-lang/unicode all_tests.sh
        run: |
          export PATH="$PWD/rocpath:$PATH"
          roc version
          cd unicode
          echo validate-fix > .roc-version
          ROC=roc ./scripts/all_tests.sh

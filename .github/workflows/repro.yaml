name: repro windows quote literal
on:
  push:
    branches: [repro-windows-quote-literal]
permissions:
  contents: read
jobs:
  repro:
    name: ${{ matrix.nightly }}
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        nightly:
          - nightly-2026-11-11-7679cc5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: roc-lang/setup-roc@dd81390553b0a1236aedb61cdd4c0ed7cf7eaec4
        with:
          version: nightly
          nightly-tag: ${{ matrix.nightly }}
      - run: roc version
      - name: Run variants
        shell: bash {0}
        run: |
          status=0
          for cmd in "check platform/Locale.roc --no-cache" "check platform/Locale.roc --no-cache -j1" "check platform/Locale.roc" "check platform/Locale.roc" "check miniL/Locale.roc --no-cache" "check miniLU/Locale.roc --no-cache" "check miniLU/main.roc --no-cache"; do
            echo "::group::roc $cmd"
            roc $cmd > out.txt 2>&1; code=$?
            cat out.txt
            echo "::endgroup::"
            echo "RESULT roc $cmd -> exit $code | $(grep -m1 -E 'crash happened|No errors|error' out.txt)"
            [ $code -eq 0 ] || status=1
          done
          exit $status

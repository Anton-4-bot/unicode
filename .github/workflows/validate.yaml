name: validate roc windows unwind fix
on:
  push:
    branches: [repro-windows-quote-literal]
    paths: [.github/workflows/validate.yaml]
permissions:
  contents: read
jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: base, repo: roc-lang/roc, ref: a5c6d8bf5bcb299d160f9eb5d4f953914254bf45 }
          - { name: fix, repo: Anton-4-bot/roc, ref: d9a82d497f8c4af559cf72168a4af253209f7686 }
    steps:
      - uses: actions/checkout@v7
        with:
          path: repro
      - uses: actions/checkout@v7
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.ref }}
          path: roc-src
          fetch-depth: 1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.17.1
          use-cache: false
      - name: Cross-compile roc.exe
        run: |
          cd roc-src
          for i in 1 2 3; do
            zig build build-release -Dtarget=x86_64-windows-gnu -Dcompiler-version=validate-${{ matrix.name }} && break
            [ $i -lt 3 ] || exit 1
          done
          ls -la zig-out/bin
      - name: Unwind table coverage
        run: python3 -I repro/tools/pdata_check.py roc-src/zig-out/bin/roc.exe
      - uses: actions/upload-artifact@v4
        with:
          name: roc-${{ matrix.name }}
          path: roc-src/zig-out/bin/roc.exe
          retention-days: 3
  test:
    name: test ${{ matrix.name }}
    needs: build
    if: always()
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        name: [base, fix]
    defaults:
      run:
        shell: bash {0}
    steps:
      - uses: actions/checkout@v7
        with:
          path: repro
      - uses: actions/checkout@v7
        with:
          repository: Anton-4-bot/unicode
          ref: fix-static-pie-platforms
          path: unicode
      - uses: actions/download-artifact@v4
        with:
          name: roc-${{ matrix.name }}
          path: rocbin
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0
          use-cache: false
      - name: Repro cases
        run: |
          ROC="$PWD/rocbin/roc.exe"
          "$ROC" version
          cd repro
          for cmd in "check hello.roc --no-cache" "check platform/Locale.roc --no-cache" "check variants/only_Path/Locale.roc --no-cache"; do
            "$ROC" $cmd > out.txt 2>&1; code=$?
            echo "RESULT roc $cmd -> exit $code | $(grep -m1 -E 'crash happened|No errors|error' out.txt)"
          done
      - name: roc-lang/unicode all_tests.sh
        run: |
          mkdir -p "$PWD/rocpath" && cp rocbin/roc.exe rocpath/roc.exe
          export PATH="$PWD/rocpath:$PATH"
          cd unicode
          ROC=roc ./scripts/all_tests.sh
